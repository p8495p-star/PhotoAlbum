plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.photoalbum.app'
    compileSdk 35

    defaultConfig {
        applicationId "ru.photoalbum.app"
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}