name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAlbum-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  build-mailcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MailCloud debug APK
        run: gradle -p MailCloud assembleDebug

      - name: Upload MailCloud APK
        uses: actions/upload-artifact@v4
        with:
          name: MailCloud-TV-debug
          path: MailCloud/app/build/outputs/apk/debug/app-debug.apk