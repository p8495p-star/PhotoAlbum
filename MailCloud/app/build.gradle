plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.mailcloud.web'
    compileSdk 35

    defaultConfig {
        applicationId "ru.mailcloud.web"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}